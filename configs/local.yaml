profile: local
namespace: local

endpoints:
  control_plane_url: "http://localhost:8080"

http:
  sandbox_runtime_address: ":8083"

postgres:
  dsn: "postgres://evalfrog@localhost:15432/evalfrog?sslmode=disable"
  schema: "evalfrog_local"
  pool_min: 1
  pool_max: 5
  server_max_connections: 100
  expected_control_plane_instances: 1

redis:
  scheduling:
    address: "localhost:16379"
    key_prefix: "evalfrog:local:sched:"
    operation_timeout: 500ms
    max_retries: 1
    eviction_policy: "noeviction"
  cache:
    address: "localhost:16380"
    key_prefix: "evalfrog:local:cache:"
    operation_timeout: 500ms
    max_retries: 0
    eviction_policy: "allkeys-lfu"

kafka:
  brokers: ["localhost:29092"]
  topic_prefix: "evalfrog.local"
  replication_factor: 1
  min_isr: 1
  max_manual_replay_window: 1h
  topics:
    builtin_task: {partitions: 1, retention: 2h}
    sandbox_task: {partitions: 1, retention: 2h}
    runtime_event: {partitions: 1, retention: 4h}
    dlq: {partitions: 1, retention: 24h}

engine:
  max_inflight: 3

scheduler:
  redis_candidate_batch: 512
  admission_concurrency: 4
  capacity_calibration_interval: 5s
  ready_reconcile_interval: 15s
  reconcile_lease: 4s
  reservation_ttl: 15s
  topic_queue_buffer: 5s
  topic_ewma_alpha: 0.4
  builtin_min_queue: 4
  builtin_max_queue: 1024
  sandbox_min_queue: 2
  sandbox_max_queue: 512
  memory_high_watermark: 0.75
  memory_resume_watermark: 0.65
  idle_poll: 20ms
  idle_poll_max: 250ms

worker:
  builtin_slots: 4
  sandbox_slots: 2
  expected_builtin_consumers: 1
  expected_sandbox_consumers: 1
  expected_runtime_event_consumers: 1
  task_poll_limit: 4
  heartbeat_interval: 2s
  lease_duration: 10s
  lost_after: 12s
  recovery_scanner_interval: 2s
  recovery_backoff: [1s, 2s, 4s]

sandbox:
  image: "evalfrog-sandbox-python:dev"
  runtime: "runc"
  command: "docker"
  runtime_url: "http://sandbox-runtime:8083/v1"
  runtime_token: "local-sandbox-runtime-token-not-for-production"

outbox:
  batch: 20
  publish_concurrency: 2
  published_retention: 24h
  inbox_retention: 24h

cache:
  execution_snapshot_ttl: 1h
  active_run_context_ttl: 30m
  terminal_run_context_ttl: 10m
  active_run_read_model_ttl: 5m
  terminal_run_read_model_ttl: 10m
  definition_negative_ttl: 10s

observability:
  log_level: "debug"
