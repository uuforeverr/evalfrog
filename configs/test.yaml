profile: test
namespace: test

endpoints:
  control_plane_url: "http://localhost:18080"

http:
  sandbox_runtime_address: ":18083"

postgres:
  dsn: "postgres://evalfrog@localhost:25432/evalfrog_test?sslmode=disable"
  schema: "evalfrog_test"
  pool_min: 2
  pool_max: 10
  server_max_connections: 100
  expected_control_plane_instances: 2

redis:
  scheduling:
    address: "localhost:26379"
    key_prefix: "evalfrog:test:sched:"
  cache:
    address: "localhost:26380"
    key_prefix: "evalfrog:test:cache:"

kafka:
  brokers: ["localhost:39092"]
  topic_prefix: "evalfrog.test"
  replication_factor: 1
  min_isr: 1
  topics:
    builtin_task: {partitions: 3, retention: 12h}
    sandbox_task: {partitions: 3, retention: 12h}
    runtime_event: {partitions: 6, retention: 24h}
    dlq: {partitions: 3, retention: 72h}

engine:
  max_inflight: 6

scheduler:
  redis_candidate_batch: 1024
  admission_concurrency: 8
  capacity_calibration_interval: 5s
  ready_reconcile_interval: 20s
  reconcile_lease: 4s
  reservation_ttl: 20s
  topic_queue_buffer: 5s
  topic_ewma_alpha: 0.4
  builtin_min_queue: 8
  builtin_max_queue: 4096
  sandbox_min_queue: 4
  sandbox_max_queue: 2048
  memory_high_watermark: 0.75
  memory_resume_watermark: 0.65
  idle_poll: 20ms
  idle_poll_max: 250ms

worker:
  builtin_slots: 8
  sandbox_slots: 4
  expected_builtin_consumers: 3
  expected_sandbox_consumers: 3
  expected_runtime_event_consumers: 6
  task_poll_limit: 8
  heartbeat_interval: 5s
  lease_duration: 20s
  lost_after: 25s
  recovery_scanner_interval: 2s
  recovery_backoff: [2s, 5s, 10s]

sandbox:
  image: "evalfrog-sandbox-python:test"
  runtime: "runc"
  command: "docker"
  runtime_url: "https://sandbox-runtime.test.internal/v1"
  runtime_token: "test-sandbox-runtime-token-not-for-production"

outbox:
  batch: 50
  publish_concurrency: 4
  published_retention: 72h
  inbox_retention: 72h

cache:
  execution_snapshot_ttl: 6h
  active_run_context_ttl: 2h
  terminal_run_context_ttl: 30m
  active_run_read_model_ttl: 10m
  terminal_run_read_model_ttl: 30m
  definition_negative_ttl: 15s
