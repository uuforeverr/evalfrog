name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24.10.0
      - name: Verify generated dependency files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Formatting
        run: test -z "$(gofmt -l cmd contracts internal tests)"
      - name: Vet
        run: go vet ./...
      - name: Unit and architecture tests
        run: go test ./...
      - name: Go reachable-vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Human Web Canvas contract and build
        working-directory: web
        run: |
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build
      - name: Authoring, definition and runtime contract repeatability
        run: go test -count=20 ./contracts/ir ./contracts/dsl ./contracts/source-map ./contracts/openapi ./contracts/messages ./internal/ir ./internal/catalog ./internal/dsl ./internal/sourcemap ./internal/compiler ./internal/access ./internal/resources ./internal/adapters/httpapi ./internal/adapters/workerapi ./internal/runtime ./internal/runtime/engine ./internal/runtime/attempt ./internal/runtime/context ./internal/eventing ./internal/recovery ./internal/worker/runtime
      - name: Core package coverage gate
        shell: bash
        run: |
          check_coverage() {
            package="$1"
            profile="$(mktemp)"
            go test -covermode=atomic -coverprofile="$profile" "$package"
            actual="$(go tool cover -func="$profile" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
            rm -f "$profile"
            awk -v package="$package" -v actual="$actual" 'BEGIN {
              if ((actual + 0) < 90) {
                printf "%s coverage %s%% is below 90%%\n", package, actual
                exit 1
              }
              printf "%s coverage %s%%\n", package, actual
            }'
          }
          check_coverage ./internal/compiler
          check_coverage ./internal/runtime/engine
          check_coverage ./internal/runtime/attempt
          check_coverage ./internal/runtime/context
      - name: Bounded IR fuzzing
        run: |
          go test ./internal/ir -run='^$' -fuzz=FuzzParser -fuzztime=5s
          go test ./internal/ir -run='^$' -fuzz=FuzzLogicalID -fuzztime=5s
      - name: Race detector
        run: go test -race ./...
      - name: Build four executables
        run: |
          go build ./cmd/evalfrog
          go build ./cmd/control-plane
          go build ./cmd/worker-builtin
          go build ./cmd/worker-sandbox
      - name: Validate all configuration profiles
        run: |
          go run ./cmd/evalfrog config validate --profile local --config-dir configs
          go run ./cmd/evalfrog config validate --profile test --config-dir configs
          go run ./cmd/evalfrog config validate --profile production-default --config-dir configs

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate Compose model
        run: docker compose -f deployments/compose.yaml config --quiet
      - name: Start stack
        run: |
          docker build -t evalfrog-sandbox-python:dev -f deployments/sandbox/Dockerfile deployments/sandbox
          docker compose -f deployments/compose.yaml up -d --build --wait
      - name: CLI doctor
        run: docker compose -f deployments/compose.yaml run --build --rm --no-deps evalfrog-cli doctor --profile local --config-dir /app/configs
      - name: Integration tests in authority network
        run: |
          docker build -t evalfrog-sandbox-python:test -f deployments/sandbox/Dockerfile deployments/sandbox
          # Resolve modules while building on the normal CI network. The test
          # process itself then runs with no authority-network egress.
          docker build --target integration-test-runner -t evalfrog-integration-runner .
          docker run --rm \
            --network evalfrog-local_authority \
            -e EVALFROG_M12_COMPOSE=1 \
            -e EVALFROG_INTEGRATION_POSTGRES_DSN=postgres://evalfrog:evalfrog@postgres:5432/evalfrog?sslmode=disable \
            -e EVALFROG_M12_POSTGRES_DSN=postgres://evalfrog:evalfrog@postgres:5432/evalfrog?sslmode=disable \
            -e EVALFROG_CACHE_REDIS_ADDRESS=redis-cache:6379 \
            -e EVALFROG_KAFKA_BROKERS=kafka:9092 \
            evalfrog-integration-runner \
            go test -tags=integration ./tests/integration
          # This adapter test intentionally exercises the Runner Docker daemon.
          # It must stay outside the socket-free authority-network test runner.
          go test -tags=integration ./internal/adapters/sandbox
      - name: Stop M0 stack
        if: always()
        run: docker compose -f deployments/compose.yaml down -v --remove-orphans

  sandbox-runsc:
    name: sandbox-runsc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install and register the gVisor Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          runsc --version
          docker info --format 'runtimes={{json .Runtimes}} default={{.DefaultRuntime}}'
          docker run --rm --runtime=runsc hello-world
      - name: Build fixed Python sandbox image
        run: docker build -t evalfrog-sandbox-python:test -f deployments/sandbox/Dockerfile deployments/sandbox
      - name: Verify Sandbox contract through runsc
        env:
          EVALFROG_SANDBOX_INTEGRATION_RUNTIME: runsc
        run: go test -count=1 -v -tags=integration ./internal/adapters/sandbox -run '^TestDockerSandboxIntegration$'
      - name: Verify 1000 runsc create destroy cycles
        env:
          EVALFROG_M12_RUNSC_STRESS: "1"
        run: go test -count=1 -v -timeout 30m -tags='integration stress' ./internal/adapters/sandbox -run '^TestDockerSandboxRunscCreateDestroyStress$'
      - name: Assert no managed Sandbox container remains
        if: always()
        run: test -z "$(docker ps -aq --filter 'label=evalfrog.sandbox=python-v1')"
